name: digix-dev

services:
  mysql:
    image: mysql:8.0
    container_name: digix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-book_library}
      MYSQL_USER: ${DB_USER:-digix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-digixpass}
      TZ: Asia/Bangkok
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: digix-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-JWT_Token_Secret_Key}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-book_library}
      DB_USER: ${DB_USER:-digix}
      DB_PASSWORD: ${DB_PASSWORD:-digixpass}
      DB_TIMEZONE: +07:00
      URL_FRONTEND: ${URL_FRONTEND:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        VITE_API_PATH: ${VITE_API_PATH:-http://localhost:8000/api}
    container_name: digix-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - /app/node_modules
    environment:
      VITE_API_PATH: ${VITE_API_PATH:-http://localhost:8000/api}
    depends_on:
      - backend

volumes:
  mysql_data:
    name: digix-mysql-data
