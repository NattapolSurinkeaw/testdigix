name: digix-prod

services:
  mysql:
    image: mysql:8.0
    container_name: digix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - digix-net

  backend:
    build:
      context: ./backend
      target: prod
    container_name: digix-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TIMEZONE: +07:00
      URL_FRONTEND: ${URL_FRONTEND}
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - digix-net

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_PATH: ${VITE_API_PATH}
    container_name: digix-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - digix-net

volumes:
  mysql_data:
    name: digix-mysql-data
  backend_uploads:
    name: digix-backend-uploads

networks:
  digix-net:
    name: digix-net
    driver: bridge
